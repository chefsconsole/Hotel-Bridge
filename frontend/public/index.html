<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0c2864" />

        <!-- Brand icons -->
        <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.svg" />

        <!-- Primary SEO meta -->
        <title>HotelBridge — Connecting Hotels with the World's Group Travel Markets</title>
        <meta name="description" content="HotelBridge connects exceptional hotels with the world's most lucrative group travel markets. 200+ partner hotels, 15+ source markets, performance-based pricing — zero setup fees." />
        <meta name="keywords" content="hotel sales representation, group bookings, tour operator partnerships, DMC network, hotel revenue management, international hotel sales, group contracting" />
        <meta name="author" content="HotelBridge" />
        <link rel="canonical" href="https://hotelbridge.co/" />

        <!-- Open Graph (LinkedIn, WhatsApp, Facebook, etc) -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://hotelbridge.co/" />
        <meta property="og:title" content="HotelBridge — Connecting Hotels with the World's Group Travel Markets" />
        <meta property="og:description" content="Unlock consistent, high-value group bookings through our network of 200+ premium tour operators and DMCs across 15+ source markets." />
        <meta property="og:image" content="https://hotelbridge.co/og-image.svg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="HotelBridge — Connecting Hotels with the World's Group Travel Markets" />
        <meta property="og:site_name" content="HotelBridge" />
        <meta property="og:locale" content="en_US" />

        <!-- Twitter / X -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="HotelBridge — Connecting Hotels with the World's Group Travel Markets" />
        <meta name="twitter:description" content="Unlock consistent, high-value group bookings through our network of 200+ premium tour operators and DMCs across 15+ source markets." />
        <meta name="twitter:image" content="https://hotelbridge.co/og-image.svg" />

        <!-- Performance: preconnect fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&display=swap" rel="stylesheet" />

        <!-- Structured data — Organization schema for Google Knowledge Panel -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "name": "HotelBridge",
          "url": "https://hotelbridge.co",
          "logo": "https://hotelbridge.co/favicon.svg",
          "image": "https://hotelbridge.co/og-image.svg",
          "description": "HotelBridge connects exceptional hotels with the world's most lucrative group travel markets through a network of 200+ tour operators and DMCs.",
          "foundingDate": "2020",
          "areaServed": "Worldwide",
          "knowsAbout": ["Hotel Sales Representation","Group Contracting","Tour Operator Partnerships","Market Development","Hospitality Consulting"],
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "info@hotelbridge.co",
            "contactType": "Customer Service",
            "availableLanguage": ["English"]
          }
        }
        </script>

        <!-- Structured data — WebSite (enables sitelinks search box) -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": "HotelBridge",
          "url": "https://hotelbridge.co"
        }
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
