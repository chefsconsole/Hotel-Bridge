# ── HotelBridge — Netlify deploy config ──────────────────

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "frontend/build"

[build.environment]
  # Resolves the date-fns / react-day-picker peer dependency conflict
  NPM_FLAGS         = "--legacy-peer-deps"
  CI                = ""          # don't treat ESLint warnings as build errors
  NODE_VERSION      = "20"
  GENERATE_SOURCEMAP = "false"     # smaller bundle, faster build

# SPA fallback — any unknown URL serves index.html so React Router handles it
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Cache static assets aggressively (hashed filenames so safe forever)
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache the entry HTML so deploys go live immediately
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sensible security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
